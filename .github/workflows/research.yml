name: Research validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official release/Node24 metadata inspected
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, official release/Node24 metadata inspected
        with:
          python-version: '3.12'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.1
      - name: Sync locked CPU research dependencies
        run: uv sync --locked
      - name: Validate specification links and manifests
        run: uv run --locked python benchmarks/audit_specification.py
      - name: Validate dashboard source identities and first-load budget
        run: uv run --locked python frontend/scripts/check_dashboard.py
      - name: Independently reconstruct saved energy arithmetic and replay identities
        run: uv run --locked python benchmarks/derive_board_energy.py
      - name: Check reconstructed evidence matches the published record
        run: git diff --exit-code -- docs/research/experiments/board-energy-derived.json
      - name: Run bounded CPU semantic controls
        run: uv run --locked pytest -q
