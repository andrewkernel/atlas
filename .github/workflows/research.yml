name: Research validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 inspected during research
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 inspected during research
        with:
          python-version: '3.12'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.1
      - name: Sync locked CPU research dependencies
        run: uv sync --locked
      - name: Validate specification links and manifests
        run: uv run --locked python benchmarks/audit_specification.py
      - name: Run bounded CPU semantic controls
        run: uv run --locked pytest -q
